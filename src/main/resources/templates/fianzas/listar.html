<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Cargo layout -->
<head th:replace="~{layout/layout :: head}"></head>
<body>
    <!-- Muestro layout -->
    <header th:replace="~{layout/layout :: header}"></header>
    <div class="container mt-4">
        
        <!-- Mensaje guardados OK -->
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${success}">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <h1 th:text="${titulo}" class="text-center mb-4"></h1>
        
        <!-- Botón para ir al formulario -->
        <a th:href="@{/fianzas/form}" class="btn btn-success mb-3">Registrar Fianza</a>

        <!-- Tabla Responsiva -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Contrato (Inquilino y Vivienda)</th>
                        <th>Importe (€)</th>
                        <th>Estado Pago</th>
                        <th>Estado Legal</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="fian : ${fianzas}">
                        <td th:text="${fian.id}"></td>
                        
                        <!--  De la Fianza al Contrato al Inquilino / Vivienda -->
                        <td th:text="'Contrato #' + ${fian.contrato.id} + ' - ' + ${fian.contrato.inquilino.nombre} + ' en ' + ${fian.contrato.vivienda.direccion}"></td>
                        
                        <!-- Doy formato a dinero con 2 decimales -->
                        <td class="fw-bold" th:text="${#numbers.formatDecimal(fian.importe, 1, 'POINT', 2, 'COMMA')} + ' €'"></td>
                        
                        <!-- Insignias para los estados -->
                        <td>
                            <span class="badge bg-warning text-dark" th:if="${fian.estadoPago == 'PENDIENTE'}" th:text="${fian.estadoPago}"></span>
                            <span class="badge bg-success" th:if="${fian.estadoPago == 'ABONADA'}" th:text="${fian.estadoPago}"></span>
                        </td>
                        
                        <td>
                            <span class="badge bg-info text-dark" th:text="${fian.estadoLegal}"></span>
                        </td>
                        
                        <td class="text-center">
                            <a class="btn btn-warning btn-sm" th:href="@{/fianzas/form/} + ${fian.id}">Editar</a>
                            <a class="btn btn-danger btn-sm" th:href="@{/fianzas/eliminar/} + ${fian.id}" 
                               onclick="return confirm('¿Seguro que quieres eliminar esta fianza?');">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <footer th:replace="~{layout/layout :: footer}"></footer>
</body>
</html>
