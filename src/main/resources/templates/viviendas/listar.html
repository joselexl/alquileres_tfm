<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Listado de Viviendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        
        <!-- Mensaje alerta -->
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${success}">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <h1 th:text="${titulo}" class="text-center mb-4"></h1>
        
        <a th:href="@{/viviendas/form}" class="btn btn-success mb-3">Nueva Vivienda</a>

        <!-- Tabla Responsiva -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Dirección</th>
                        <th>Localidad</th>
                        <th>Precio (€)</th>
                        <th>Hab.</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="viv : ${viviendas}">
                        <td th:text="${viv.id}"></td>
                        <td th:text="${viv.direccion}"></td>
                        <td th:text="${viv.localidad}"></td>
                        <td th:text="${viv.precio}"></td>
                        <td th:text="${viv.habitaciones}"></td>
                        <td th:text="${viv.estado}"></td>
                        <td class="text-center">
                            <a class="btn btn-warning btn-sm" th:href="@{/viviendas/form/} + ${viv.id}">Editar</a>
                            <a class="btn btn-danger btn-sm" th:href="@{/viviendas/eliminar/} + ${viv.id}" 
                               onclick="return confirm('¿Seguro que quieres eliminar esta vivienda?');">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
