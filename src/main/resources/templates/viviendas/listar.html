<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Cargamos el layout -->
<head th:replace="~{layout/layout :: head}"></head>
<body>
    <!-- Muestro el layout -->
    <header th:replace="~{layout/layout :: header}"></header>
    <div class="container mt-4">
        
        <!-- Mensaje alerta -->
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${success}">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <h1 th:text="${titulo}" class="text-center mb-4"></h1>
        
        <a th:href="@{/viviendas/form}" class="btn btn-success mb-3">Nueva Vivienda</a>

        <!-- Tabla Responsiva -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Dirección</th>
                        <th>Localidad</th>
                        <th>Precio (€)</th>
                        <th>Hab.</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="viv : ${viviendas}">
                        <td th:text="${viv.id}"></td>
                        <td th:text="${viv.direccion}"></td>
                        <td th:text="${viv.localidad}"></td>
                        <td th:text="${viv.precio}"></td>
                        <td th:text="${viv.habitaciones}"></td>
                        <td th:text="${viv.estado}"></td>
                        <td class="text-center">
                            <a class="btn btn-warning btn-sm" th:href="@{/viviendas/form/} + ${viv.id}">Editar</a>
                            <a class="btn btn-danger btn-sm" th:href="@{/viviendas/eliminar/} + ${viv.id}" 
                               onclick="return confirm('¿Seguro que quieres eliminar esta vivienda?');">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
              
    </div>
    <footer th:replace="~{layout/layout :: footer}"></footer>
</body>
</html>
