<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${titulo}" class="mb-4 text-center"></h1>

        <!-- /viviendas/form -->
        <form th:action="@{/viviendas/form}" th:object="${vivienda}" method="post" class="w-50 mx-auto">
            
            <!-- Campo oculto para el ID  -->
            <input type="hidden" th:field="*{id}" />

            <!-- Dirección -->
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" th:field="*{direccion}" id="direccion" placeholder="Ej: Calle Estacion, 17, 2A">
                <div class="form-text text-danger" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
            </div>

            <!-- Localidad -->
            <div class="mb-3">
                <label for="localidad" class="form-label">Localidad / Ciudad</label>
                <input type="text" class="form-control" th:field="*{localidad}" id="localidad">
                <div class="form-text text-danger" th:if="${#fields.hasErrors('localidad')}" th:errors="*{localidad}"></div>
            </div>

            <!-- Precio -->
            <div class="mb-3">
                <label for="precio" class="form-label">Precio de Alquiler (€)</label>
                <!-- step="0.01" permite poner decimales -->
                <input type="number" step="0.01" class="form-control" th:field="*{precio}" id="precio">
                <div class="form-text text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
            </div>

            <!-- Habitaciones -->
            <div class="mb-3">
                <label for="habitaciones" class="form-label">Número de Habitaciones</label>
                <input type="number" class="form-control" th:field="*{habitaciones}" id="habitaciones">
                <div class="form-text text-danger" th:if="${#fields.hasErrors('habitaciones')}" th:errors="*{habitaciones}"></div>
            </div>

            <!-- Status -->
            <div class="mb-4">
                <label for="estado" class="form-label">Estado de la Vivienda</label>
                <select class="form-select" th:field="*{estado}" id="estado">
                    <option value="">-- Selecciona el estado --</option>
                    <option value="DISPONIBLE">Disponible</option>
                    <option value="ALQUILADA">Alquilada</option>
                    <option value="EN REFORMA">En Reforma</option>
                </select>
                <div class="form-text text-danger" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                <button type="submit" class="btn btn-primary px-4">Guardar Vivienda</button>
                <!-- volver listar para la vivienda -->
                <a th:href="@{/viviendas/listar}" class="btn btn-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
