<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Listado base</title>
    
    <!--  Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- margen superior -->
    <div class="container mt-4" >    
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${success}">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>    
        <h1 th:text="${titulo}" class="text-center mb-4">Título de la página</h1>     
        <a th:href="@{/form}" class="btn btn-success mb-3">Nuevo Inquilino</a>   
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>DNI</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Editar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inq : ${inquilinos}">
                        <td th:text="${inq.id}"></td>
                        <td th:text="${inq.nombre}"></td>
                        <td th:text="${inq.apellidos}"></td>
                        <td th:text="${inq.dni}"></td>
                        <td th:text="${inq.email}"></td>
                        <td th:text="${inq.telefono}"></td>
                        <td class="text-center">
                            <a class="btn btn-warning btn-sm" th:href="@{/form/} + ${inq.id}">Editar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- bundle bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
