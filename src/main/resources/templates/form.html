<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${titulo}" class="mb-4"></h1>

        <form th:action="@{/form}" th:object="${inquilino}" method="post" class="w-50">
            <!-- campo oculto para el ID -->
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" id="nombre">
                <!-- AVISO DE ERROR PARA NOMBRE -->
                <div class="form-text text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>

            <div class="mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input type="text" class="form-control" th:field="*{apellidos}" id="apellidos">
                <!-- AVISO DE ERROR PARA APELLIDOS -->
                <div class="form-text text-danger" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
            </div>

            <div class="mb-3">
                <label for="dni" class="form-label">DNI</label>
                <input type="text" class="form-control" th:field="*{dni}" id="dni">
                <!-- AVISO DE ERROR PARA DNI -->
                <div class="form-text text-danger" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control" th:field="*{email}" id="email">
                <!-- AVISO DE ERROR PARA EMAIL -->
                <div class="form-text text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" th:field="*{telefono}" id="telefono">
                <!-- El tlf no es obligatorio -->
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/listar}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
