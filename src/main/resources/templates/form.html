<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario</title>
    <!-- Cargo Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        
        <h1 th:text="${titulo}" class="text-center mb-4">Formulario de Inquilino</h1>

        <!-- Formulario centrado  -->
        <div class="card col-md-8 offset-md-2 shadow">
            <div class="card-body">
                <!-- enviamos los datos al hacer clic en Guardar -->
                <form th:action="@{/form}" th:object="${inquilino}" method="post">
                    
                    <!-- Campo oculto para el ID  -->
                    <input type="hidden" th:field="*{id}" />

                    <!-- Nombre -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" id="nombre" required>
                    </div>

                    <!-- Apellidos -->
                    <div class="mb-3">
                        <label for="apellidos" class="form-label fw-bold">Apellidos</label>
                        <input type="text" class="form-control" th:field="*{apellidos}" id="apellidos" required>
                    </div>

                    <!-- DNI -->
                    <div class="mb-3">
                        <label for="dni" class="form-label fw-bold">DNI</label>
                        <input type="text" class="form-control" th:field="*{dni}" id="dni" required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" id="email" required>
                    </div>

                    <!-- Teléfono -->
                    <div class="mb-3">
                        <label for="telefono" class="form-label fw-bold">Teléfono</label>
                        <input type="text" class="form-control" th:field="*{telefono}" id="telefono">
                    </div>

                    <!-- Botones -->
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary px-4">Guardar Inquilino</button>
                        <a class="btn btn-secondary px-4" th:href="@{/listar}">Cancelar / Volver</a>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
