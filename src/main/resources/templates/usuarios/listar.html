<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Cargamos el layout -->
<head th:replace="~{layout/layout :: head}"></head>
<body>
    <!-- Muestro el layout -->
    <header th:replace="~{layout/layout :: header}"></header>
    
    <div class="container mt-4">
        
        <!-- Mensaje alerta (Por si luego desde el controlador mandamos un mensaje de "Usuario guardado con éxito") -->
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${success}">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <!-- Título principal centrado para que cuadre con las otras pantallas -->
        <h1 th:text="${titulo}" class="text-center mb-4"></h1>
        
        <!-- Botón verde de crear, con su icono correspondiente -->
        <a th:href="@{/usuarios/form}" class="btn btn-success mb-3">
            <i class="bi bi-person-plus-fill me-1"></i>Nuevo Usuario
        </a>

        <!-- Tabla Responsiva: Esto es clave para que en el móvil no se rompa la pantalla -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Rol</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Bucle que pinta cada usuario de la base de datos -->
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.id}"></td>
                        <td th:text="${usuario.username}"></td>
                        <td th:text="${usuario.rol}"></td>
                        <td class="text-center">
                            <!-- Botón de Editar apuntando al ID del usuario -->
                            <a class="btn btn-warning btn-sm" th:href="@{/usuarios/form/} + ${usuario.id}">
                                <i class="bi bi-pencil-square"></i>Editar
                            </a>
                            <!-- Botón de Eliminar con la alerta de confirmación en JavaScript -->
                            <a class="btn btn-danger btn-sm" th:href="@{/usuarios/eliminar/} + ${usuario.id}" 
                               onclick="return confirm('¿Seguro que quieres eliminar este usuario? ¡Le quitarás el acceso!');">
                                <i class="bi bi-trash-fill"></i>Eliminar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
              
    </div>
    
    <!-- Scripts del pie de página -->
    <footer th:replace="~{layout/layout :: footer}"></footer>
</body>
</html>
