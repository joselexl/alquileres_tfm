<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Head estilos y título -->
<head th:fragment="head">
    <meta charset="UTF-8">
    <title th:text="${titulo}">Gestión de Alquileres TFM</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- Menú de navegación -->
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <!-- Logo -->
                <a class="navbar-brand fw-bold" th:href="@{/contratos/listar}">AppRent TFM</a>
                
                <!-- Botón para móviles-->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>                
                <!-- Menú principal -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/contratos/listar}">Contratos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/inquilinos/listar}">Inquilinos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/viviendas/listar}">Viviendas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/fianzas/listar}">Fianzas</a>
                        </li>
                    </ul>

                    <!-- Datos de usuario y logout -->
                    <ul class="navbar-nav ms-auto" sec:authorize="isAuthenticated()">
                        <li class="nav-item d-flex align-items-center">
                            <!-- Nombre del usuario logueado -->
                            <span class="nav-link text-white fw-bold me-3">
                                <i class="bi bi-person-circle"></i> Hola, <span sec:authentication="name"></span>
                            </span>
                        </li>
                        <li class="nav-item">
                            <!-- Formulario para cerrar sesión -->
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger btn-sm mt-1">
                                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>    
    <div class="container">        
    </div>    
    <!-- Scripts -->
    <footer th:fragment="footer">
        <!-- Script de Bootstrap 5 -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </footer>

</body>
</html>
