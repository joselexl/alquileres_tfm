<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Head estilos y título -->
<head th:fragment="head">
    <meta charset="UTF-8">
    <title th:text="${titulo}">Gestión de Alquileres TFM</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Menú de navegación -->
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <!-- Logo -->
                <a class="navbar-brand fw-bold" th:href="@{/contratos/listar}">AppRent TFM</a>
                
                <!-- Botón para móviles-->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- Menú-->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/contratos/listar}">Contratos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/inquilinos/listar}">Inquilinos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/viviendas/listar}">Viviendas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/fianzas/listar}">Fianzas</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div class="container">        
    </div>
    <!-- Scripts -->
    <footer th:fragment="footer">
        <!-- Script de Bootstrap 5 -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </footer>

</body>
</html>
