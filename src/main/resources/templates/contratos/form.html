<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${titulo}" class="mb-4 text-center"></h1>

        <form th:action="@{/contratos/form}" th:object="${contrato}" method="post" class="w-50 mx-auto shadow p-4 rounded bg-light">
            
            <!-- Campo oculto ID -->
            <input type="hidden" th:field="*{id}" />

            <!-- DESPLEGABLE DE INQUILINOS @ManyToOne -->
            <div class="mb-3">
                <label for="inquilino" class="form-label fw-bold">Inquilino</label>
                <select class="form-select" th:field="*{inquilino}" id="inquilino">
                    <option value="">-- Selecciona el inquilino --</option>
                    <!-- Recorro la lista de inquilinos del controlador -->
                    <option th:each="inq : ${inquilinos}" 
                            th:value="${inq.id}" 
                            th:text="${inq.nombre + ' ' + inq.apellidos}">
                    </option>
                </select>
                <div class="form-text text-danger" th:if="${#fields.hasErrors('inquilino')}" th:errors="*{inquilino}"></div>
            </div>

            <!-- DESPLEGABLE DE VIVIENDAS @ManyToOne -->
            <div class="mb-3">
                <label for="vivienda" class="form-label fw-bold">Vivienda a alquilar</label>
                <select class="form-select" th:field="*{vivienda}" id="vivienda">
                    <option value="">-- Selecciona la vivienda --</option>
                    <!-- Recorro la lista de viviendas -->
                    <option th:each="viv : ${viviendas}" 
                            th:value="${viv.id}" 
                            th:text="${viv.direccion + ' (' + viv.localidad + ')'}">
                    </option>
                </select>
                <div class="form-text text-danger" th:if="${#fields.hasErrors('vivienda')}" th:errors="*{vivienda}"></div>
            </div>

            <!-- FECHA DE INICIO  -->
            <div class="mb-3 row">
                <div class="col">
                    <label for="fechaInicio" class="form-label fw-bold">Fecha de Inicio</label>
                    <input type="date" class="form-control" th:field="*{fechaInicio}" id="fechaInicio">
                    <div class="form-text text-danger" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
                </div>
                <div class="col">
                    <label for="fechaFin" class="form-label fw-bold">Fecha de Fin</label>
                    <input type="date" class="form-control" th:field="*{fechaFin}" id="fechaFin">
                    <div class="form-text text-danger" th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}"></div>
                </div>
            </div>

            <!-- ESTADO DEL CONTRATO -->
            <div class="mb-4">
                <label for="estadoContrato" class="form-label fw-bold">Estado del Contrato</label>
                <select class="form-select" th:field="*{estadoContrato}" id="estadoContrato">
                    <option value="">-- Selecciona el estado --</option>
                    <option value="PENDIENTE">Pendiente de firma</option>
                    <option value="ENVIADO">Enviado a las partes</option>
                    <option value="FIRMADO">Firmado (Activo)</option>
                </select>
                <div class="form-text text-danger" th:if="${#fields.hasErrors('estadoContrato')}" th:errors="*{estadoContrato}"></div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                <button type="submit" class="btn btn-primary px-4">Guardar Contrato</button>
                <a th:href="@{/contratos/listar}" class="btn btn-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
