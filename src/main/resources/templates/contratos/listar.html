<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Listado de Contratos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        
        <!-- Mensaje Flash para el guardado -->
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${success}">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <h1 th:text="${titulo}" class="text-center mb-4"></h1>
        
        <!-- Botón para ir al formulario -->
        <a th:href="@{/contratos/form}" class="btn btn-success mb-3">Nuevo Contrato</a>

        <!-- Tabla Responsiva -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Inquilino</th>
                        <th>Vivienda</th>
                        <th>F. Inicio</th>
                        <th>F. Fin</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cont : ${contratos}">
                        <td th:text="${cont.id}"></td>
                        
                        <!-- Concateno el nombre y los apellidos del inquilino -->
                        <td th:text="${cont.inquilino.nombre + ' ' + cont.inquilino.apellidos}"></td>
                        
                        <!-- Muestro la calle y entre paréntesis la localidad -->
                        <td th:text="${cont.vivienda.direccion + ' (' + cont.vivienda.localidad + ')'}"></td>
                        
                        <!-- Fechas del contrato -->
                        <td th:text="${cont.fechaInicio}"></td>
                        <td th:text="${cont.fechaFin}"></td>
                        
                        <!-- Estado con una insignia  -->
                        <td>
                            <span class="badge bg-info text-dark" th:text="${cont.estadoContrato}"></span>
                        </td>
                        
                        <td class="text-center">
                            <a class="btn btn-warning btn-sm" th:href="@{/contratos/form/} + ${cont.id}">Editar</a>
                            <a class="btn btn-danger btn-sm" th:href="@{/contratos/eliminar/} + ${cont.id}" 
                               onclick="return confirm('¿Seguro que quieres eliminar este contrato? ¡Es una acción irreversible!');">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Botones de navegación inferior  -->
        <div class="mt-4 text-center">
            <a th:href="@{/viviendas/listar}" class="btn btn-outline-secondary">Ir a Viviendas</a>
            <a th:href="@{/listar}" class="btn btn-outline-secondary">Ir a Inquilinos</a>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
